name: Bump Claude Code

# Keeps the agent image's Claude Code current without waiting on upstream.
# Dependabot can't do this: the version lives in a Dockerfile ARG, which none of
# its ecosystems read. Two jobs:
#   bump:  weekly, opens (or refreshes) one PR moving ARG CLAUDE_CODE_VERSION in
#          services/sandbox/Dockerfile to npm's latest @anthropic-ai/claude-code.
#   build: when that ARG changes on main (a bump PR or an upstream sync), dispatch
#          publish-images for the agent image, since fork pushes don't publish.
# Pinning the new image in centaur-archetype-infra stays a manual PR.
#
# Token: set CLAUDE_CODE_BUMP_TOKEN (fine-grained PAT, oddharsh/centaur, Contents
# and Pull requests read/write) so the bump PR triggers CI. Without it the job
# falls back to GITHUB_TOKEN, which needs "Allow GitHub Actions to create and
# approve pull requests" on, and its PRs don't trigger CI.

on:
  schedule:
    # Mondays 15:00 UTC, the same morning Dependabot runs.
    - cron: "0 15 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [services/sandbox/Dockerfile]

permissions:
  contents: read

env:
  DOCKERFILE: services/sandbox/Dockerfile
  BRANCH: bot/claude-code-bump

jobs:
  bump:
    name: Open Claude Code bump PR
    if: ${{ github.repository == 'oddharsh/centaur' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_CODE_BUMP_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CLAUDE_CODE_BUMP_TOKEN || github.token }}

      - name: Bump ARG CLAUDE_CODE_VERSION to npm latest
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' "$DOCKERFILE")"
          latest="$(npm view @anthropic-ai/claude-code version)"
          if [[ -z "$current" || -z "$latest" ]]; then
            echo "::error::could not read versions (pin '$current', npm '$latest')"
            exit 1
          fi
          if [[ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" == "$current" ]]; then
            echo "Claude Code $current is at or ahead of npm latest $latest" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sed -i "s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=${latest}/" "$DOCKERFILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "sandbox: bump Claude Code to ${latest}"
          git push --force origin "$BRANCH"

          title="sandbox: bump Claude Code to ${latest}"
          body="$(cat <<EOF
          Moves the agent image's Claude Code from ${current} to ${latest}, npm's current \`latest\`.

          Changelog: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md

          Merging dispatches \`publish-images\` for the agent image (release profile). The cluster doesn't move until the new \`sha-*\` agent image is pinned in centaur-archetype-infra.

          Opened by \`.github/workflows/bump-claude-code.yml\`. A newer release force-pushes this branch and retitles this PR.
          EOF
          )"
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body" --label dependencies
          fi
          echo "Bump PR: ${current} -> ${latest}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Rebuild agent image
    if: ${{ github.repository == 'oddharsh/centaur' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dispatch publish-images when the pin moved
        run: |
          set -euo pipefail
          pin() { sed -n 's/^ARG CLAUDE_CODE_VERSION=//p'; }
          after="$(pin < "$DOCKERFILE")"
          # Other Dockerfile edits don't need a rebuild here. If the old pin
          # can't be read, rebuild anyway: a spare image is cheap.
          before=""
          if git fetch --quiet --depth=1 origin "$BEFORE"; then
            before="$(git show "${BEFORE}:${DOCKERFILE}" | pin)"
          fi
          if [[ "$before" == "$after" ]]; then
            echo "Claude Code pin unchanged at $after; no rebuild" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run publish-images.yml --ref main -f services=agent -f rust_build_profile=release
          echo "Claude Code ${before:-?} -> ${after}: dispatched publish-images; expect agent image sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
