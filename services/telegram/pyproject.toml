[project]
name = "centaur-telegram"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.26.0",
  "telethon==1.45.0",
  "cryptography>=46,<47",
  "qrcode[pil]>=8.2,<9",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
